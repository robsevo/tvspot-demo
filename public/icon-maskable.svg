<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Opaque background (iOS/Android home-screen icons must NOT be transparent —
       a transparent PNG renders as a black square). Safe-zone padding so the
       maskable crop on Android doesn't clip the logo. -->
  <rect width="100" height="100" fill="#141414"/>
  <rect x="14" y="26" width="72" height="48" rx="8" fill="#E50914"/>
  <rect x="19" y="31" width="62" height="38" rx="4" fill="#141414"/>
  <rect x="24" y="36" width="20" height="15" rx="3" fill="#E50914" opacity="0.95"/>
  <rect x="48" y="37" width="27" height="3" rx="1.5" fill="#ffffff" opacity="0.45"/>
  <rect x="48" y="43" width="20" height="3" rx="1.5" fill="#ffffff" opacity="0.32"/>
  <rect x="48" y="49" width="15" height="3" rx="1.5" fill="#ffffff" opacity="0.22"/>
  <rect x="40" y="74" width="20" height="4" rx="2" fill="#E50914"/>
  <rect x="33" y="78" width="34" height="3" rx="1.5" fill="#E50914" opacity="0.5"/>
</svg>
